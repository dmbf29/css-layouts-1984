<html>
  <head>
    <meta charset="utf-8">

    <title>Bootstrap demo</title>

    <!-- Need to read device screen width (Bootstrap) -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap & Fontawesome CSS only! -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.1.1/css/all.css">
  </head>
  <!-- NEVER OVERRIDE BOOTSTRAP CLASSES-->
  <body>
    <nav class="navbar bg-body-tertiary border-bottom mb-3">
      <div class="container">
        <a class="navbar-brand" href="#">
          <img src="images/logo.png" class="w-25">
        </a>
        <a href="" class="btn btn-primary">Login</a>
      </div>
    </nav>
    <div class="container">
      <div class="row">
        <div class="col-12 col-md-8">
          <div id="carouselExample" class="carousel slide">
            <div class="carousel-inner">
              <div class="carousel-item active">
                <img src="images/flat.jpg" alt="" class="d-block w-100 rounded">
              </div>
              <div class="carousel-item">
                <img src="images/bedroom.jpg" alt="" class="d-block w-100 rounded">
              </div>
              <div class="carousel-item">
                <img src="images/bathroom.jpg" alt="" class="d-block w-100 rounded">
              </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Next</span>
            </button>
          </div>
          <h1 class="my-2">Lovely flat in Meguro, Tokyo</h1>
          <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Perferendis maxime est consequatur, ea, blanditiis deleniti eveniet, in eum vero provident exercitationem illum voluptatem impedit maiores error velit obcaecati. Eligendi, corrupti?</p>
        </div>
        <div class="col-12 col-md-4">
          <div class="py-3 px-4 border rounded">
            <h3>Book this Flat</h3>
            <form>
              <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Message</label>
                <input type="text" class="form-control" placeholder="Say something to the owner...">
              </div>
              <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Arrival</label>
                <input type="date" class="form-control">
              </div>
              <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Departure</label>
                <input type="date" class="form-control">
              </div>

              <button type="submit" class="btn btn-primary w-100">Book Now</button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <!-- Bootstrap JavaScript library -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.min.js" integrity="sha384-VQqxDN0EQCkWoxt/0vsQvZswzTHUVOImccYmSyhJTp7kGtPed0Qcx8rK9h9YEgx+" crossorigin="anonymous"></script>
  </body>
</html>
